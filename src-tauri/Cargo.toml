[package]
name = "kenshell"
version = "0.1.0"
description = "KenShell — lightweight network terminal"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "kenshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
serialport = { version = "4.10", default-features = false }
nusb = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-lite = "2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tauri-plugin-opener = "2"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2", "des"] }
arboard = { version = "3.7", default-features = false }
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
zeroize = "1.8"
tauri-plugin-dialog = "2"
# Encrypted backup (ADR-011): both already in the tree through russh / ssh-key.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
ring = "0.17"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
