# Cisco Catalyst 9300 / IOS-XE 17.9 — synthetic but format-faithful outputs.
name = "cisco-ios"
vendor = "Cisco"
hostname = "core-sw-01"
banner = """
*****************************************************
*  Authorized access only. core-sw-01 (LAB)          *
*****************************************************
"""
motd = ""
username = "admin"
password = "admin"
enable_password = "cisco"
username_prompt = "\r\nUser Access Verification\r\n\r\nUsername: "
password_prompt = "Password: "
more_prompt = " --More-- "
terminal_length = 24
iface_space = false
iface_types = ["GigabitEthernet", "TenGigabitEthernet", "FastEthernet", "FortyGigabitEthernet", "TwentyFiveGigE", "Port-channel", "Vlan", "Loopback", "AppGigabitEthernet"]
reload_text = """
Proceed with reload? [confirm]

*Nov  4 12:00:01.123: %SYS-5-RELOAD: Reload requested by admin on console. Reload Reason: Reload Command.
Chassis 1 reloading, reason - Reload command

Initializing Hardware...
System Bootstrap, Version 17.9.1r, RELEASE SOFTWARE (P)
Copyright (c) 1994-2022 by cisco Systems, Inc.

Booting...Boot image: flash:packages.conf
Press RETURN to get started!
"""

[prompts]
user = "{host}>"
privileged = "{host}#"
config = "{host}(config)#"
interface = "{host}(config-if)#"
submode = "{host}({sub})#"

[messages]
invalid_input = "% Invalid input detected at '^' marker."
ambiguous = "% Ambiguous command:  \"{cmd}\""
incomplete = "% Incomplete command."
login_failed = "% Login invalid"
enable_failed = "% Bad secrets"

[[submodes]]
keyword = "vlan"
suffix = "config-vlan"

[[submodes]]
keyword = "line"
suffix = "config-line"

[[submodes]]
keyword = "router"
suffix = "config-router"

