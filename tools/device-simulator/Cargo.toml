[package]
name = "device-simulator"
version = "0.1.0"
description = "Local Telnet/stdio network-device simulator (Cisco, Ruijie profiles) for KenShell tests"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Dev tool only — never bundled into the app. Kept dependency-light on purpose.
[dependencies]
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2", "des"] }
serde = { version = "1", features = ["derive"] }
serialport = { version = "4.10", default-features = false }
tokio = { version = "1", features = ["rt", "net", "macros", "time", "sync"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[lints]
workspace = true

[target."cfg(unix)".dependencies]
nix = { version = "0.26", default-features = false, features = ["term", "fs"] }
