name: CI

# Private repo: GitHub bills macOS minutes x10 and Windows x2. Only the cheap Linux
# frontend job runs on every push; the macOS/Windows/e2e/bundle jobs run when started
# by hand (Actions → CI → Run workflow) or for a version tag (v*).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which heavy jobs to run'
        type: choice
        default: all
        options: [all, linux-e2e, windows, macos, bundles]

# Pushes supersede older pushes; a manual full run is never cancelled by a push.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx vite build
      - name: Bundle budget (JS < 500 KB gzip)
        run: npm run bench:bundle

  rust:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","windows","macos"]'), inputs.scope))
    strategy:
      fail-fast: false
      matrix:
        # matrix is not available in job-level `if`, so the scope picks the OS list here
        os: ${{ fromJSON(inputs.scope == 'windows' && '["windows-latest"]' || inputs.scope == 'macos' && '["macos-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'clippy, rustfmt' }
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # tauri::generate_context! needs the frontend dist at compile time
      - run: npx vite build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Network end-to-end (Telnet/SSH vs device simulator)
        run: |
          cargo build -p device-simulator
          cargo test -p kenshell net_e2e -- --ignored --test-threads 1

  e2e-linux:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'linux-e2e'))
    # Real SessionManager + autobaud + serial transport against the device simulator on a
    # pseudo-terminal (not possible on macOS: ptys reject IOSSIOSPEED).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev
      - run: npm ci
      - run: npx vite build
      - run: cargo build -p device-simulator
      - run: cargo test -p kenshell e2e -- --ignored

  bundle:
    # runs when rust passed OR was skipped (scope=bundles)
    if: "!cancelled() && !failure() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'bundles')))"
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ''
            targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.targets }}' }
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - name: Installer size budget
        shell: bash
        run: |
          if [ -d target/universal-apple-darwin ]; then mkdir -p target/release && rm -rf target/release/bundle && cp -R target/universal-apple-darwin/release/bundle target/release/bundle; fi
          node bench/measure-app.mjs --sizes-only
      - uses: actions/upload-artifact@v4
        with:
          name: kenshell-${{ matrix.os }}
          path: |
            target/**/bundle/dmg/*.dmg
            target/**/bundle/nsis/*.exe
            target/**/bundle/msi/*.msi
          if-no-files-found: warn
