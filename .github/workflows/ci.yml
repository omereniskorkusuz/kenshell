name: CI

# Private repo: GitHub bills macOS minutes x10 and Windows x2. Only the cheap Linux
# frontend job runs on every push; the macOS/Windows/e2e/bundle jobs run when started
# by hand (Actions → CI → Run workflow) or for a version tag (v*).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which heavy jobs to run'
        type: choice
        default: all
        options: [all, linux-e2e, windows, macos, bundles]

# Pushes supersede older pushes; a manual full run is never cancelled by a push.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx vite build
      - name: Bundle budget (JS < 500 KB gzip)
        run: npm run bench:bundle

  rust:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","windows","macos"]'), inputs.scope))
    strategy:
      fail-fast: false
      matrix:
        # matrix is not available in job-level `if`, so the scope picks the OS list here
        os: ${{ fromJSON(inputs.scope == 'windows' && '["windows-latest"]' || inputs.scope == 'macos' && '["macos-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'clippy, rustfmt' }
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # tauri::generate_context! needs the frontend dist at compile time
      - run: npx vite build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Network end-to-end (Telnet/SSH vs device simulator)
        run: |
          cargo build -p device-simulator
          cargo test -p kenshell net_e2e -- --ignored --test-threads 1

  e2e-linux:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'linux-e2e'))
    # Real SessionManager + autobaud + serial transport against the device simulator on a
    # pseudo-terminal (not possible on macOS: ptys reject IOSSIOSPEED).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev
      - run: npm ci
      - run: npx vite build
      - run: cargo build -p device-simulator
      - run: cargo test -p kenshell e2e -- --ignored

  bundle:
    # runs when rust passed OR was skipped (scope=bundles)
    if: "!cancelled() && !failure() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'bundles')))"
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ''
            targets: ''
          # Linux preparation (P5-T12): AppImage + .deb; 22.04 for an older glibc baseline.
          - os: ubuntu-22.04
            args: '--bundles appimage,deb'
            targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.targets }}' }
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf
      - run: npm ci
      # Signing and updater artifacts are optional: each step does nothing until its
      # secrets / variables exist. Unsigned builds work.
      - name: Signing and updater config (only when configured)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
          UPDATER_BASE_URL: ${{ vars.UPDATER_BASE_URL }}
        run: |
          overlay='{}'
          if [ "$RUNNER_OS" = macOS ] && [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "${!v}" ]; then { echo "$v<<EOF"; echo "${!v}"; echo EOF; } >> "$GITHUB_ENV"; fi
            done
            echo "macOS signing + notarization: on"
          fi
          if [ -n "$UPDATER_KEY" ] && [ -n "$UPDATER_PUBKEY" ] && [ -n "$UPDATER_BASE_URL" ]; then
            { echo "TAURI_SIGNING_PRIVATE_KEY<<EOF"; echo "$UPDATER_KEY"; echo EOF; } >> "$GITHUB_ENV"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$UPDATER_KEY_PASSWORD" >> "$GITHUB_ENV"
            overlay=$(node -e 'const [k,u]=process.argv.slice(1);console.log(JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:k,endpoints:[u.replace(/\/+$/,"")+"/latest.json"]}}}))' "$UPDATER_PUBKEY" "$UPDATER_BASE_URL")
            echo "updater artifacts: on"
          fi
          echo "$overlay" > src-tauri/tauri.ci.conf.json
      - name: Windows code signing (only when configured)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "Windows signing: off"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pass = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pass
          Remove-Item $pfx
          $conf = Get-Content src-tauri/tauri.ci.conf.json | ConvertFrom-Json -AsHashtable
          $conf.bundle = ($conf.bundle ?? @{})
          $conf.bundle.windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' }
          $conf | ConvertTo-Json -Depth 8 | Set-Content src-tauri/tauri.ci.conf.json
          Write-Host "Windows signing: on"
      - run: npx tauri build ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json
      - name: Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force target/release/bundle/portable | Out-Null
          Copy-Item target/release/kenshell.exe target/release/bundle/portable/KenShell.exe
          Compress-Archive -Force -Path target/release/bundle/portable/KenShell.exe -DestinationPath "target/release/bundle/portable/KenShell_${ver}_x64_portable.zip"
          Remove-Item target/release/bundle/portable/KenShell.exe
      - name: Installer size budget
        shell: bash
        run: |
          if [ -d target/universal-apple-darwin ]; then mkdir -p target/release && rm -rf target/release/bundle && cp -R target/universal-apple-darwin/release/bundle target/release/bundle; fi
          node bench/measure-app.mjs --sizes-only
      - uses: actions/upload-artifact@v4
        with:
          name: kenshell-${{ matrix.os }}
          path: |
            target/**/bundle/dmg/*.dmg
            target/**/bundle/nsis/*.exe
            target/**/bundle/nsis/*.sig
            target/**/bundle/msi/*.msi
            target/**/bundle/macos/*.app.tar.gz
            target/**/bundle/macos/*.sig
            target/**/bundle/portable/*.zip
            target/**/bundle/appimage/*.AppImage
            target/**/bundle/deb/*.deb
          if-no-files-found: warn

  release:
    # A version tag makes a DRAFT release with every bundle (and latest.json when the
    # updater is configured); publishing it stays a manual step.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist-release }
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATER_BASE_URL: ${{ vars.UPDATER_BASE_URL }}
        run: |
          tag="${GITHUB_REF_NAME}"
          files=$(find dist-release -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.app.tar.gz' -o -name '*.sig' \))
          if [ -n "$UPDATER_BASE_URL" ] && ls $files | grep -q '\.sig$'; then
            node tools/scripts/latest-json.mjs "$tag" "${UPDATER_BASE_URL%/}/$tag" dist-release > latest.json
            files="$files latest.json"
          fi
          gh release create "$tag" --draft --title "KenShell $tag" --generate-notes $files
